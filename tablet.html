<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Digital India</title>

<style>

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;
    color: white;

    font-family: Arial, sans-serif;

}


/* ============================= */
/* IDLE SCREEN                   */
/* ============================= */

#idle {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );

}


#flag {

    font-size: 70px;

}


h1 {

    font-size: 55px;

    letter-spacing: 3px;

    margin: 10px 0;

}


h2 {

    font-size: 32px;

    margin: 10px 0;

}


p {

    font-size: 22px;

    margin-top: 30px;

    opacity: 0.85;

}


/* ============================= */
/* VIDEO SCREEN                  */
/* ============================= */

#videoScreen {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    z-index: 9999;

}


/* ============================= */
/* VIDEO                         */
/* ============================= */

#digitalIndiaVideo {

    display: block;

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: black;

}


/* ============================= */
/* TEST BUTTON                   */
/* ============================= */

#testButton {

    position: fixed;

    bottom: 30px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 10000;

    padding: 18px 35px;

    font-size: 24px;

    font-weight: bold;

    border: none;

    border-radius: 12px;

    background: white;

    color: black;

    cursor: pointer;

}


/* ============================= */
/* STATUS                        */
/* ============================= */

#status {

    position: fixed;

    top: 20px;

    left: 20px;

    z-index: 10001;

    background: rgba(0,0,0,0.75);

    padding: 10px 15px;

    font-size: 16px;

}

</style>

</head>


<body>


<!-- ================================= -->
<!-- IDLE SCREEN                       -->
<!-- ================================= -->

<div id="idle">

    <div id="flag">
        🇮🇳
    </div>

    <h1>
        DIGITAL INDIA
    </h1>

    <h2>
        INDIA @ 2047
    </h2>

    <p>
        SCAN TODAY. SHAPE TOMORROW.
    </p>

</div>


<!-- ================================= -->
<!-- VIDEO SCREEN                      -->
<!-- ================================= -->

<div id="videoScreen">

    <video
        id="digitalIndiaVideo"
        src="Snapchat-409127156.mp4"
        muted
        playsinline
        preload="auto"
        controls>
    </video>

</div>


<!-- ================================= -->
<!-- TEST BUTTON                      -->
<!-- ================================= -->

<button
    id="testButton"
    style="display:none;">
    ▶ TEST PLAY
</button>


<!-- ================================= -->
<!-- STATUS                           -->
<!-- ================================= -->

<div id="status">
    TABLET STARTING...
</div>


<script>


/* ================================= */
/* GOOGLE APPS SCRIPT                */
/* ================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw90g38bCidu7E4ZTbnm2n7tUE4G-AQkgLaWx94Gi5curKVm9qYsykA7NCDK79Dalh7YQ/exec";


/* ================================= */
/* TOKEN                             */
/* ================================= */

const TOKEN =
"DIGITALINDIA2047";


/* ================================= */
/* STATE                             */
/* ================================= */

let lastTriggerId = null;

let initialized = false;


/* ================================= */
/* ELEMENTS                          */
/* ================================= */

const idle =
    document.getElementById("idle");

const videoScreen =
    document.getElementById("videoScreen");

const video =
    document.getElementById("digitalIndiaVideo");

const testButton =
    document.getElementById("testButton");

const status =
    document.getElementById("status");


/* ================================= */
/* INITIAL VIDEO STATE               */
/* ================================= */

video.pause();

video.currentTime = 0;

video.muted = true;

video.playsInline = true;


/* ================================= */
/* STATUS FUNCTION                   */
/* ================================= */

function setStatus(message) {

    console.log(message);

    status.innerText = message;

}


/* ================================= */
/* CHECK GOOGLE                     */
/* ================================= */

async function checkTrigger() {

    try {

        const response =
            await fetch(

                API_URL +
                "?action=status" +
                "&token=" +
                TOKEN +
                "&t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        const data =
            await response.json();


        console.log(
            "GOOGLE STATUS:",
            data
        );


        setStatus(
            "Google: " +
            (data.ok ? "CONNECTED" : "ERROR")
        );


        /* ============================= */
        /* FIRST CHECK                   */
        /* ============================= */

        if (!initialized) {

            lastTriggerId =
                data.triggerId || "";

            initialized = true;

            console.log(
                "TABLET READY"
            );

            return;

        }


        /* ============================= */
        /* NEW TRIGGER                   */
        /* ============================= */

        if (

            data.ok &&

            data.triggerId &&

            data.triggerId !==
            lastTriggerId

        ) {

            console.log(
                "NEW TRIGGER!"
            );

            lastTriggerId =
                data.triggerId;

            startExperience();

        }


    }

    catch (error) {

        console.log(
            "STATUS ERROR:",
            error
        );

        setStatus(
            "Google connection error"
        );

    }

}


/* ================================= */
/* START EXPERIENCE                  */
/* ================================= */

function startExperience() {

    console.log(
        "START EXPERIENCE"
    );

    setStatus(
        "START TRIGGER RECEIVED"
    );


    /* Hide idle */

    idle.style.display =
        "none";


    /* Show video */

    videoScreen.style.display =
        "block";


    /* Show test button */

    testButton.style.display =
        "block";


    /* Reset video */

    video.pause();

    video.currentTime = 0;

    video.muted = true;

    video.playsInline = true;


    /* Load */

    video.load();


    setStatus(
        "VIDEO LOADING..."
    );


    /* Try autoplay */

    video.play()

        .then(() => {

            console.log(
                "VIDEO PLAYING"
            );

            setStatus(
                "VIDEO PLAYING"
            );

        })

        .catch(error => {

            console.log(
                "PLAY ERROR:",
                error
            );

            setStatus(
                "AUTOPLAY BLOCKED - TAP TEST PLAY"
            );

        });

}


/* ================================= */
/* MANUAL TEST PLAY                  */
/* ================================= */

testButton.addEventListener(
    "click",
    function () {

        console.log(
            "MANUAL TEST PLAY"
        );


        video.muted = true;


        video.play()

            .then(() => {

                console.log(
                    "MANUAL PLAY SUCCESS"
                );

                setStatus(
                    "MANUAL PLAY SUCCESS"
                );

                testButton.style.display =
                    "none";

            })

            .catch(error => {

                console.log(
                    "MANUAL PLAY ERROR:",
                    error
                );

                setStatus(
                    "MANUAL PLAY FAILED"
                );

            });

    }
);


/* ================================= */
/* VIDEO EVENTS                     */
/* ================================= */

video.addEventListener(
    "loadeddata",
    function () {

        console.log(
            "VIDEO LOADEDDATA"
        );

        setStatus(
            "VIDEO DATA LOADED"
        );

    }
);


video.addEventListener(
    "canplay",
    function () {

        console.log(
            "VIDEO CAN PLAY"
        );

    }
);


video.addEventListener(
    "playing",
    function () {

        console.log(
            "VIDEO PLAYING EVENT"
        );

    }
);


video.addEventListener(
    "waiting",
    function () {

        console.log(
            "VIDEO WAITING / BUFFERING"
        );

    }
);


video.addEventListener(
    "error",
    function () {

        console.log(
            "VIDEO ERROR:",
            video.error
        );

        if (video.error) {

            setStatus(
                "VIDEO ERROR: " +
                video.error.code
            );

        }

    }
);


/* ================================= */
/* VIDEO FINISHED                   */
/* ================================= */

video.addEventListener(
    "ended",
    function () {

        console.log(
            "VIDEO FINISHED"
        );


        video.pause();

        video.currentTime = 0;


        videoScreen.style.display =
            "none";


        testButton.style.display =
            "none";


        idle.style.display =
            "flex";


        setStatus(
            "TABLET READY"
        );

    }
);


/* ================================= */
/* CHECK EVERY SECOND                */
/* ================================= */

setInterval(

    checkTrigger,

    1000

);


/* ================================= */
/* FIRST CHECK                      */
/* ================================= */

checkTrigger();


</script>

</body>

</html>
