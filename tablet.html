<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Digital India</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
}

#idle {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );
}

#flag {
    font-size: 70px;
}

h1 {
    font-size: 55px;
    letter-spacing: 3px;
    margin: 10px 0;
}

h2 {
    font-size: 32px;
    margin: 10px 0;
}

p {
    font-size: 22px;
    margin-top: 30px;
    opacity: 0.85;
}

#video {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

</style>

</head>

<body>

<div id="idle">

    <div id="flag">🇮🇳</div>

    <h1>DIGITAL INDIA</h1>

    <h2>INDIA @ 2047</h2>

    <p>SCAN TODAY. SHAPE TOMORROW.</p>

    <div id="qrcode"></div>

</div>

<div id="video">

    <iframe
        src=""
        allow="autoplay; fullscreen">
    </iframe>

</div>
      <script>

// Your Google Apps Script URL
const API_URL =
"https://script.google.com/macros/s/AKfycbw90g38bCidu7E4ZTbnm2n7tUE4G-AQkgLaWx94Gi5curKVm9qYsykA7NCDK79Dalh7YQ/exec";

// Same token used by trigger.html
const TOKEN =
"DIGITALINDIA2047";


// Remember the last trigger we have processed
let lastTriggerId = "";


// Check Google Apps Script
async function checkTrigger() {

    try {

        const response = await fetch(

            API_URL +
            "?action=status" +
            "&token=" +
            TOKEN +
            "&t=" +
            Date.now()

        );

        const data =
            await response.json();


        console.log("Trigger status:", data);


        // Did we receive a valid new trigger?
        if (
            data.ok &&
            data.triggerId &&
            data.triggerId !== lastTriggerId
        ) {

            // Remember this trigger
            lastTriggerId =
                data.triggerId;


            // Start Digital India
            startExperience();

        }

    }

    catch (error) {

        console.log(
            "Trigger check failed:",
            error
        );

    }

}


// Start the Digital India experience
function startExperience() {

    console.log(
        "DIGITAL INDIA EXPERIENCE STARTED"
    );


    // Hide idle screen
    document.getElementById(
        "idle"
    ).style.display = "none";


    // Show video screen
    document.getElementById(
        "video"
    ).style.display = "block";


    // Put your video/experience URL here
    document.querySelector(
        "#video iframe"
    ).src =
        "https://www.youtube.com/embed/MrZ-fHGRxNI?autoplay=1&controls=1";


}


// Check every 1 second
setInterval(
    checkTrigger,
    1000
);


// Check immediately when tablet opens
checkTrigger();

</script>


</body>
</html>
