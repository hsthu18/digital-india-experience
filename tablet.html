<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Digital India 2047</title>


<style>

/* ================================= */
/* BASIC PAGE                        */
/* ================================= */

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;

    color: white;

    font-family: Arial, sans-serif;

}


/* ================================= */
/* IDLE SCREEN                       */
/* ================================= */

#idle {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );

}


/* ================================= */
/* FLAG                              */
/* ================================= */

#flag {

    font-size: 65px;

    margin-bottom: 5px;

}


/* ================================= */
/* MAIN TITLE                        */
/* ================================= */

h1 {

    font-size: 52px;

    letter-spacing: 4px;

    margin: 5px 0;

}


/* ================================= */
/* SUBTITLE                          */
/* ================================= */

h2 {

    font-size: 30px;

    letter-spacing: 2px;

    margin: 5px 0 15px 0;

}


/* ================================= */
/* QR INSTRUCTION                    */
/* ================================= */

#scanText {

    font-size: 24px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-top: 5px;

    margin-bottom: 15px;

}


/* ================================= */
/* QR CONTAINER                      */
/* ================================= */

#qrContainer {

    width: 230px;

    height: 230px;

    background: white;

    padding: 12px;

    border-radius: 12px;

    display: flex;

    justify-content: center;

    align-items: center;

    box-sizing: border-box;

    box-shadow:
        0 0 25px rgba(255,255,255,0.25);

}


/* ================================= */
/* QR CODE                           */
/* ================================= */

#qrCode {

    width: 205px;

    height: 205px;

}


/* ================================= */
/* BOTTOM TEXT                       */
/* ================================= */

#bottomText {

    font-size: 20px;

    margin-top: 18px;

    opacity: 0.9;

    letter-spacing: 1px;

}


/* ================================= */
/* VIDEO SCREEN                      */
/* ================================= */

#videoScreen {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: black;

    z-index: 9999;

    overflow: hidden;

}


/* ================================= */
/* VIDEO                             */
/* ================================= */

#digitalIndiaVideo {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: black;

}


/* ================================= */
/* OPTIONAL STATUS                   */
/* ================================= */

#status {

    position: fixed;

    bottom: 5px;

    left: 5px;

    font-size: 10px;

    opacity: 0.25;

    z-index: 10000;

}

</style>

</head>


<body>


<!-- ================================= -->
<!-- IDLE SCREEN                       -->
<!-- ================================= -->

<div id="idle">


    <!-- FLAG -->

    <div id="flag">
        🇮🇳
    </div>


    <!-- TITLE -->

    <h1>
        DIGITAL INDIA
    </h1>


    <!-- SUBTITLE -->

    <h2>
        INDIA @ 2047
    </h2>


    <!-- SCAN MESSAGE -->

    <div id="scanText">
        SCAN TO START THE EXPERIENCE
    </div>


    <!-- QR CODE -->

    <div id="qrContainer">

        <div id="qrCode"></div>

    </div>


    <!-- BOTTOM MESSAGE -->

    <div id="bottomText">
        SCAN TODAY. SHAPE TOMORROW.
    </div>


</div>


<!-- ================================= -->
<!-- VIDEO SCREEN                      -->
<!-- ================================= -->

<div id="videoScreen">


    <video
        id="digitalIndiaVideo"
        src="Snapchat-409127156.mp4"
        muted
        playsinline
        preload="auto"
        controls>
    </video>


</div>


<!-- ================================= -->
<!-- STATUS                            -->
<!-- ================================= -->

<div id="status">
    TABLET READY
</div>


<!-- ================================= -->
<!-- QR CODE LIBRARY                   -->
<!-- ================================= -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<script>


/* ================================= */
/* GOOGLE APPS SCRIPT                */
/* ================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw90g38bCidu7E4ZTbnm2n7tUE4G-AQkgLaWx94Gi5curKVm9qYsykA7NCDK79Dalh7YQ/exec";


/* ================================= */
/* TOKEN                             */
/* ================================= */

const TOKEN =
"DIGITALINDIA2047";


/* ================================= */
/* QR TRIGGER URL                    */
/* ================================= */

/*
 * This is the URL that the visitor's
 * phone will open when scanning.
 *
 * Opening this URL sends the START
 * command to Google Apps Script.
 */

const QR_TRIGGER_URL =
    API_URL +
    "?action=trigger" +
    "&token=" +
    encodeURIComponent(TOKEN);


/* ================================= */
/* CREATE QR CODE                    */
/* ================================= */

new QRCode(

    document.getElementById("qrCode"),

    {

        text: QR_TRIGGER_URL,

        width: 205,

        height: 205,

        colorDark: "#000000",

        colorLight: "#ffffff",

        correctLevel:
            QRCode.CorrectLevel.H

    }

);


/* ================================= */
/* STATE                             */
/* ================================= */

let lastTriggerId = null;

let initialized = false;


/* ================================= */
/* ELEMENTS                          */
/* ================================= */

const idle =
    document.getElementById("idle");


const videoScreen =
    document.getElementById("videoScreen");


const video =
    document.getElementById(
        "digitalIndiaVideo"
    );


const status =
    document.getElementById("status");


/* ================================= */
/* INITIAL VIDEO STATE               */
/* ================================= */

video.pause();

video.currentTime = 0;

video.muted = true;

video.playsInline = true;


/* ================================= */
/* STATUS FUNCTION                   */
/* ================================= */

function setStatus(message) {

    console.log(message);

    status.innerText = message;

}


/* ================================= */
/* CHECK GOOGLE APPS SCRIPT          */
/* ================================= */

async function checkTrigger() {

    try {


        const response =
            await fetch(

                API_URL +
                "?action=status" +
                "&token=" +
                encodeURIComponent(TOKEN) +
                "&t=" +
                Date.now(),

                {

                    cache: "no-store"

                }

            );


        const data =
            await response.json();


        console.log(
            "GOOGLE STATUS:",
            data
        );


        /* ============================= */
        /* FIRST CHECK                   */
        /* ============================= */

        if (!initialized) {


            /*
             * Remember the current trigger.
             *
             * This prevents an old trigger
             * from starting the video when
             * the tablet is first opened.
             */

            lastTriggerId =
                data.triggerId || "";


            initialized = true;


            setStatus(
                "TABLET READY"
            );


            console.log(
                "TABLET READY"
            );


            console.log(
                "Existing trigger:",
                lastTriggerId
            );


            return;

        }


        /* ============================= */
        /* NEW TRIGGER                   */
        /* ============================= */

        if (

            data.ok &&

            data.triggerId &&

            data.triggerId !==
            lastTriggerId

        ) {


            console.log(
                "NEW TRIGGER!"
            );


            lastTriggerId =
                data.triggerId;


            startExperience();

        }


    }

    catch (error) {


        console.log(
            "STATUS ERROR:",
            error
        );


        setStatus(
            "CONNECTION ERROR"
        );

    }

}


/* ================================= */
/* START EXPERIENCE                  */
/* ================================= */

function startExperience() {


    console.log(
        "START EXPERIENCE"
    );


    setStatus(
        "EXPERIENCE STARTING"
    );


    /* ============================= */
    /* HIDE IDLE                     */
    /* ============================= */

    idle.style.display =
        "none";


    /* ============================= */
    /* SHOW VIDEO                    */
    /* ============================= */

    videoScreen.style.display =
        "block";


    /* ============================= */
    /* RESET VIDEO                   */
    /* ============================= */

    video.pause();

    video.currentTime = 0;

    video.muted = true;


    /* ============================= */
    /* TRY TO PLAY                   */
    /* ============================= */

    video.play()

        .then(() => {


            console.log(
                "VIDEO PLAYING"
            );


            setStatus(
                "VIDEO PLAYING"
            );


        })

        .catch(error => {


            console.log(
                "PLAY ERROR:",
                error
            );


            /*
             * Chrome may block automatic
             * playback.
             *
             * The video controls remain
             * available, so visitor can
             * tap Play.
             */

            setStatus(
                "TAP PLAY TO START"
            );


        });

}


/* ================================= */
/* VIDEO FINISHED                   */
/* ================================= */

video.addEventListener(

    "ended",

    function () {


        console.log(
            "VIDEO FINISHED"
        );


        /* Stop */

        video.pause();

        video.currentTime = 0;


        /* Hide video */

        videoScreen.style.display =
            "none";


        /* Return to idle */

        idle.style.display =
            "flex";


        setStatus(
            "TABLET READY"
        );


    }

);


/* ================================= */
/* VIDEO ERROR                      */
/* ================================= */

video.addEventListener(

    "error",

    function () {


        console.log(
            "VIDEO ERROR:",
            video.error
        );


    }

);


/* ================================= */
/* CHECK EVERY SECOND                */
/* ================================= */

setInterval(

    checkTrigger,

    1000

);


/* ================================= */
/* FIRST CHECK                      */
/* ================================= */

checkTrigger();


</script>


</body>

</html>
