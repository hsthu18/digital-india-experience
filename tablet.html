<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Digital India</title>


<style>

/* ================================= */
/* PAGE                              */
/* ================================= */

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;

    color: white;

    font-family: Arial, sans-serif;

}


/* ================================= */
/* IDLE SCREEN                       */
/* ================================= */

#idle {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );

}


#flag {

    font-size: 70px;

}


h1 {

    font-size: 55px;

    letter-spacing: 3px;

    margin: 10px 0;

}


h2 {

    font-size: 32px;

    margin: 10px 0;

}


p {

    font-size: 22px;

    margin-top: 30px;

    opacity: 0.85;

}


/* ================================= */
/* VIDEO SCREEN                      */
/* ================================= */

#videoScreen {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    z-index: 1000;

}


/* ================================= */
/* VIDEO                             */
/* ================================= */

#digitalIndiaVideo {

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: black;

}

</style>

</head>


<body>


<!-- ================================= -->
<!-- IDLE SCREEN                       -->
<!-- ================================= -->

<div id="idle">

    <div id="flag">
        🇮🇳
    </div>

    <h1>
        DIGITAL INDIA
    </h1>

    <h2>
        INDIA @ 2047
    </h2>

    <p>
        SCAN TODAY. SHAPE TOMORROW.
    </p>

    <div id="qrcode"></div>

</div>


<!-- ================================= -->
<!-- VIDEO SCREEN                      -->
<!-- ================================= -->

<div id="videoScreen">

    <video
        id="digitalIndiaVideo"
        src="Snapchat-409127156.mp4"
        playsinline
        controls
        preload="auto">
    </video>

</div>


<script>


/* ================================= */
/* GOOGLE APPS SCRIPT URL             */
/* ================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw90g38bCidu7E4ZTbnm2n7tUE4G-AQkgLaWx94Gi5curKVm9qYsykA7NCDK79Dalh7YQ/exec";


/* ================================= */
/* TOKEN                             */
/* ================================= */

const TOKEN =
"DIGITALINDIA2047";


/* ================================= */
/* LAST TRIGGER                      */
/* ================================= */

/*
 * null means the tablet has not yet
 * checked Google Sheets.
 */

let lastTriggerId = null;


/* ================================= */
/* CHECK FOR TRIGGER                 */
/* ================================= */

async function checkTrigger() {

    try {

        const response =
            await fetch(

                API_URL +
                "?action=status" +
                "&token=" +
                TOKEN +
                "&t=" +
                Date.now()

            );


        const data =
            await response.json();


        console.log(
            "Trigger status:",
            data
        );


        /* ================================= */
        /* FIRST CHECK                       */
        /* ================================= */

        if (lastTriggerId === null) {

            /*
             * The tablet has just opened.
             *
             * Remember the trigger that already
             * exists in Google Sheets.
             *
             * DO NOT start the video.
             */

            lastTriggerId =
                data.triggerId || "";


            console.log(
                "Initial trigger remembered:",
                lastTriggerId
            );


            return;

        }


        /* ================================= */
        /* CHECK FOR NEW TRIGGER             */
        /* ================================= */

        if (

            data.ok &&

            data.triggerId &&

            data.triggerId !==
            lastTriggerId

        ) {


            console.log(
                "NEW TRIGGER DETECTED"
            );


            /* Remember new trigger */

            lastTriggerId =
                data.triggerId;


            /* Start experience */

            startExperience();

        }

    }

    catch (error) {

        console.log(
            "Trigger check error:",
            error
        );

    }

}


/* ================================= */
/* START EXPERIENCE                  */
/* ================================= */

function startExperience() {


    console.log(
        "STARTING DIGITAL INDIA EXPERIENCE"
    );


    /* ============================= */
    /* GET ELEMENTS                  */
    /* ============================= */

    const idle =
        document.getElementById(
            "idle"
        );


    const videoScreen =
        document.getElementById(
            "videoScreen"
        );


    const video =
        document.getElementById(
            "digitalIndiaVideo"
        );


    /* ============================= */
    /* HIDE IDLE SCREEN               */
    /* ============================= */

    idle.style.display =
        "none";


    /* ============================= */
    /* SHOW VIDEO SCREEN              */
    /* ============================= */

    videoScreen.style.display =
        "block";


    /* ============================= */
    /* START FROM BEGINNING           */
    /* ============================= */

    video.currentTime = 0;


    /* ============================= */
    /* PLAY VIDEO                     */
    /* ============================= */

    video.play()

        .then(() => {

            console.log(
                "VIDEO PLAYING"
            );

        })

        .catch(error => {

            console.log(
                "VIDEO PLAY ERROR:",
                error
            );

        });

}


/* ================================= */
/* CHECK EVERY 1 SECOND              */
/* ================================= */

setInterval(

    checkTrigger,

    1000

);


/* ================================= */
/* FIRST CHECK                       */
/* ================================= */

checkTrigger();


</script>


</body>

</html>
