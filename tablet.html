<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Digital India</title>


<style>

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;

    color: white;

    font-family: Arial, sans-serif;

}


/* ============================= */
/* IDLE SCREEN                   */
/* ============================= */

#idle {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );

}


#flag {

    font-size: 70px;

}


h1 {

    font-size: 55px;

    letter-spacing: 3px;

    margin: 10px 0;

}


h2 {

    font-size: 32px;

    margin: 10px 0;

}


p {

    font-size: 22px;

    margin-top: 30px;

    opacity: 0.85;

}


/* ============================= */
/* VIDEO SCREEN                  */
/* ============================= */

#videoScreen {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    z-index: 9999;

}


/* ============================= */
/* VIDEO                         */
/* ============================= */

#digitalIndiaVideo {

    display: block;

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: black;

}

</style>

</head>


<body>


<!-- ================================= -->
<!-- IDLE SCREEN                       -->
<!-- ================================= -->

<div id="idle">

    <div id="flag">
        🇮🇳
    </div>

    <h1>
        DIGITAL INDIA
    </h1>

    <h2>
        INDIA @ 2047
    </h2>

    <p>
        SCAN TODAY. SHAPE TOMORROW.
    </p>

</div>


<!-- ================================= -->
<!-- VIDEO SCREEN                      -->
<!-- ================================= -->

<div id="videoScreen">

    <video
        id="digitalIndiaVideo"
        src="Snapchat-409127156.mp4"
        playsinline
        controls
        preload="metadata">
    </video>

</div>


<script>


/* ================================= */
/* GOOGLE APPS SCRIPT                */
/* ================================= */

const API_URL =
"https://script.google.com/macros/library/d/1LcadS0c03kVoh40cScuJhJGQEZqBc4OeqRQJkGx_DX7IwF9jLyhHmZan/5";


/* ================================= */
/* TOKEN                             */
/* ================================= */

const TOKEN =
"DIGITALINDIA2047";


/* ================================= */
/* STATE                             */
/* ================================= */

let lastTriggerId = null;

let initialized = false;


/* ================================= */
/* ELEMENTS                          */
/* ================================= */

const idle =
    document.getElementById("idle");


const videoScreen =
    document.getElementById("videoScreen");


const video =
    document.getElementById(
        "digitalIndiaVideo"
    );


/* ================================= */
/* MAKE SURE VIDEO IS STOPPED        */
/* ================================= */

video.pause();

video.currentTime = 0;


/* ================================= */
/* CHECK GOOGLE                     */
/* ================================= */

async function checkTrigger() {

    try {


        const response =
            await fetch(

                API_URL +
                "?action=status" +
                "&token=" +
                TOKEN +
                "&t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        const data =
            await response.json();


        console.log(
            "GOOGLE STATUS:",
            data
        );


        /* ============================= */
        /* FIRST CHECK                   */
        /* ============================= */

        if (!initialized) {


            /*
             * Remember current trigger.
             *
             * DO NOT play video.
             */

            lastTriggerId =
                data.triggerId || "";


            initialized = true;


            console.log(
                "TABLET READY"
            );


            console.log(
                "Existing trigger:",
                lastTriggerId
            );


            return;

        }


        /* ============================= */
        /* NEW TRIGGER                   */
        /* ============================= */

        if (

            data.ok &&

            data.triggerId &&

            data.triggerId !==
            lastTriggerId

        ) {


            console.log(
                "NEW TRIGGER!"
            );


            lastTriggerId =
                data.triggerId;


            startExperience();

        }


    }

    catch (error) {

        console.log(
            "STATUS ERROR:",
            error
        );

    }

}


/* ================================= */
/* START EXPERIENCE                  */
/* ================================= */

function startExperience() {


    console.log(
        "START EXPERIENCE"
    );


    /* ============================= */
    /* HIDE IDLE                     */
    /* ============================= */

    idle.style.display =
        "none";


    /* ============================= */
    /* SHOW VIDEO                    */
    /* ============================= */

    videoScreen.style.display =
        "block";


    /* ============================= */
    /* RESET                         */
    /* ============================= */

    video.pause();

    video.currentTime = 0;


    /* ============================= */
    /* PLAY                          */
    /* ============================= */

    video.play()

        .then(() => {

            console.log(
                "VIDEO PLAYING"
            );

        })

        .catch(error => {

            console.log(
                "PLAY ERROR:",
                error
            );

        });

}


/* ================================= */
/* CHECK EVERY SECOND                */
/* ================================= */

setInterval(

    checkTrigger,

    1000

);


/* ================================= */
/* FIRST CHECK                      */
/* ================================= */

checkTrigger();


</script>


</body>

</html>
