<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Digital India</title>


<style>

/* ================================= */
/* PAGE                              */
/* ================================= */

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;

    color: white;

    font-family: Arial, sans-serif;

}


/* ================================= */
/* IDLE SCREEN                       */
/* ================================= */

#idle {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );

}


#flag {

    font-size: 70px;

}


h1 {

    font-size: 55px;

    letter-spacing: 3px;

    margin: 10px 0;

}


h2 {

    font-size: 32px;

    margin: 10px 0;

}


p {

    font-size: 22px;

    margin-top: 30px;

    opacity: 0.85;

}


/* ================================= */
/* VIDEO SCREEN                      */
/* ================================= */

#videoScreen {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    z-index: 9999;

}


/* ================================= */
/* VIDEO                             */
/* ================================= */

#digitalIndiaVideo {

    display: block;

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: black;

}

</style>

</head>


<body>


<!-- ================================= -->
<!-- IDLE SCREEN                       -->
<!-- ================================= -->

<div id="idle">

    <div id="flag">
        🇮🇳
    </div>

    <h1>
        DIGITAL INDIA
    </h1>

    <h2>
        INDIA @ 2047
    </h2>

    <p>
        SCAN TODAY. SHAPE TOMORROW.
    </p>

</div>


<!-- ================================= -->
<!-- VIDEO SCREEN                      -->
<!-- ================================= -->

<div id="videoScreen">

    <video
        id="digitalIndiaVideo"
        src="Snapchat-409127156.mp4"
        playsinline
        controls
        preload="metadata">

    </video>

</div>


<script>


/* ================================= */
/* GOOGLE APPS SCRIPT                */
/* ================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw90g38bCidu7E4ZTbnm2n7tUE4G-AQkgLaWx94Gi5curKVm9qYsykA7NCDK79Dalh7YQ/exec";


/* ================================= */
/* SECURITY TOKEN                    */
/* ================================= */

const TOKEN =
"DIGITALINDIA2047";


/* ================================= */
/* TRIGGER STATE                     */
/* ================================= */

/*
 * The tablet remembers the last trigger
 * it has seen.
 */

let lastTriggerId = null;


/*
 * This becomes true after the first
 * successful check of Google Apps Script.
 */

let initialized = false;


/* ================================= */
/* PAGE ELEMENTS                     */
/* ================================= */

const idle =
    document.getElementById(
        "idle"
    );


const videoScreen =
    document.getElementById(
        "videoScreen"
    );


const video =
    document.getElementById(
        "digitalIndiaVideo"
    );


/* ================================= */
/* INITIAL VIDEO STATE               */
/* ================================= */

/*
 * Make absolutely sure video is not
 * playing when tablet first opens.
 */

video.pause();

video.currentTime = 0;


/* ================================= */
/* CHECK GOOGLE APPS SCRIPT          */
/* ================================= */

async function checkTrigger() {

    try {


        /* ============================= */
        /* REQUEST STATUS                */
        /* ============================= */

        const response =
            await fetch(

                API_URL +
                "?action=status" +
                "&token=" +
                TOKEN +
                "&t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        /* ============================= */
        /* READ RESPONSE                 */
        /* ============================= */

        const data =
            await response.json();


        console.log(
            "GOOGLE STATUS:",
            data
        );


        /* ============================= */
        /* FIRST CHECK                   */
        /* ============================= */

        if (!initialized) {


            /*
             * Remember the trigger that
             * already existed.
             *
             * DO NOT PLAY VIDEO.
             */

            lastTriggerId =
                data.triggerId || "";


            initialized = true;


            console.log(
                "TABLET INITIALIZED"
            );


            console.log(
                "CURRENT TRIGGER:",
                lastTriggerId
            );


            return;

        }


        /* ============================= */
        /* NEW TRIGGER                   */
        /* ============================= */

        if (

            data.ok &&

            data.triggerId &&

            data.triggerId !==
            lastTriggerId

        ) {


            console.log(
                "NEW QR TRIGGER DETECTED"
            );


            /*
             * Remember new trigger
             */

            lastTriggerId =
                data.triggerId;


            /*
             * Start video
             */

            startExperience();

        }


    }

    catch (error) {


        console.log(
            "TRIGGER CHECK ERROR:",
            error
        );


    }

}


/* ================================= */
/* START EXPERIENCE                  */
/* ================================= */

function startExperience() {


    console.log(
        "STARTING DIGITAL INDIA VIDEO"
    );


    /* ============================= */
    /* HIDE IDLE SCREEN              */
    /* ============================= */

    idle.style.display =
        "none";


    /* ============================= */
    /* SHOW VIDEO                    */
    /* ============================= */

    videoScreen.style.display =
        "block";


    /* ============================= */
    /* START FROM BEGINNING          */
    /* ============================= */

    video.currentTime = 0;


    /* ============================= */
    /* ENABLE AUDIO                  */
    /* ============================= */

    video.muted = false;


    video.volume = 1.0;


    /* ============================= */
    /* PLAY VIDEO                    */
    /* ============================= */

    const playPromise =
        video.play();


    if (
        playPromise !== undefined
    ) {


        playPromise

            .then(() => {


                console.log(
                    "VIDEO PLAYING WITH AUDIO"
                );


            })

            .catch(error => {


                console.log(
                    "AUTOPLAY BLOCKED"
                );


                console.log(
                    "ERROR NAME:",
                    error.name
                );


                console.log(
                    "ERROR MESSAGE:",
                    error.message
                );


            });

    }

}


/* ================================= */
/* VIDEO ENDED                      */
/* ================================= */

video.addEventListener(
    "ended",
    function() {


        console.log(
            "VIDEO FINISHED"
        );


        /*
         * Stop video
         */

        video.pause();


        video.currentTime = 0;


        /*
         * Hide video
         */

        videoScreen.style.display =
            "none";


        /*
         * Show idle screen
         */

        idle.style.display =
            "flex";


        console.log(
            "TABLET READY FOR NEXT VISITOR"
        );

    }
);


/* ================================= */
/* CHECK EVERY SECOND                */
/* ================================= */

setInterval(

    checkTrigger,

    1000

);


/* ================================= */
/* FIRST CHECK                      */
/* ================================= */

checkTrigger();


</script>


</body>

</html>
