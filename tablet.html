<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Digital India</title>


<style>

/* ================================= */
/* PAGE                              */
/* ================================= */

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;

    color: white;

    font-family: Arial, sans-serif;

}


/* ================================= */
/* IDLE SCREEN                       */
/* ================================= */

#idle {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );

}


#flag {

    font-size: 70px;

}


h1 {

    font-size: 55px;

    letter-spacing: 3px;

    margin: 10px 0;

}


h2 {

    font-size: 32px;

    margin: 10px 0;

}


p {

    font-size: 22px;

    margin-top: 30px;

    opacity: 0.85;

}


/* ================================= */
/* VIDEO SCREEN                      */
/* ================================= */

#videoScreen {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    z-index: 1000;

}


/* ================================= */
/* VIDEO                             */
/* ================================= */

#digitalIndiaVideo {

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: black;

}

</style>

</head>


<body>


<!-- ================================= -->
<!-- IDLE SCREEN                       -->
<!-- ================================= -->

<div id="idle">

    <div id="flag">
        🇮🇳
    </div>

    <h1>
        DIGITAL INDIA
    </h1>

    <h2>
        INDIA @ 2047
    </h2>

    <p>
        SCAN TODAY. SHAPE TOMORROW.
    </p>

    <div id="qrcode"></div>

</div>


<!-- ================================= -->
<!-- VIDEO SCREEN                      -->
<!-- ================================= -->

<div id="videoScreen">

    <video
        id="digitalIndiaVideo"
        src="Snapchat-409127156.mp4"
        playsinline
        controls
        preload="metadata">
    </video>

</div>


<script>


/* ================================= */
/* GOOGLE APPS SCRIPT                */
/* ================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw90g38bCidu7E4ZTbnm2n7tUE4G-AQkgLaWx94Gi5curKVm9qYsykA7NCDK79Dalh7YQ/exec";


/* ================================= */
/* TOKEN                             */
/* ================================= */

const TOKEN =
"DIGITALINDIA2047";


/* ================================= */
/* TRIGGER STATE                     */
/* ================================= */


/*
 * null means:
 *
 * "Tablet has not checked Google Sheet yet."
 */

let lastTriggerId = null;


/*
 * Becomes true after the first
 * Google Sheet check.
 */

let initialized = false;


/* ================================= */
/* VIDEO ELEMENT                     */
/* ================================= */

const video =
    document.getElementById(
        "digitalIndiaVideo"
    );


/*
 * IMPORTANT:
 *
 * Make absolutely sure the video
 * is stopped when tablet opens.
 */

video.pause();

video.currentTime = 0;


/* ================================= */
/* CHECK GOOGLE SHEET                */
/* ================================= */

async function checkTrigger() {

    try {


        /* ============================= */
        /* REQUEST STATUS                */
        /* ============================= */

        const response =
            await fetch(

                API_URL +
                "?action=status" +
                "&token=" +
                TOKEN +
                "&t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        /* ============================= */
        /* READ RESPONSE                 */
        /* ============================= */

        const data =
            await response.json();


        console.log(
            "TABLET CHECK:",
            data.triggerId,
            "LAST:",
            lastTriggerId
        );


        /* ================================= */
        /* FIRST CHECK                       */
        /* ================================= */


        if (lastTriggerId === null) {


            /*
             * Remember whatever trigger
             * already exists.
             *
             * DO NOT START VIDEO.
             */


            lastTriggerId =
                data.triggerId || "";


            initialized = true;


            console.log(
                "TABLET INITIALIZED."
            );


            console.log(
                "Existing trigger:",
                lastTriggerId
            );


            return;

        }


        /* ================================= */
        /* ONLY AFTER INITIALIZATION          */
        /* ================================= */


        if (

            initialized &&

            data.ok &&

            data.triggerId &&

            data.triggerId !==
            lastTriggerId

        ) {


            console.log(
                "NEW QR TRIGGER DETECTED!"
            );


            /* ============================= */
            /* SAVE NEW TRIGGER              */
            /* ============================= */

            lastTriggerId =
                data.triggerId;


            /* ============================= */
            /* START EXPERIENCE              */
            /* ============================= */

            startExperience();

        }


    }

    catch (error) {


        console.log(
            "TRIGGER CHECK ERROR:",
            error
        );


    }

}


/* ================================= */
/* START EXPERIENCE                  */
/* ================================= */

function startExperience() {


    console.log(
        "STARTING DIGITAL INDIA EXPERIENCE"
    );


    /* ============================= */
    /* GET SCREENS                   */
    /* ============================= */

    const idle =
        document.getElementById(
            "idle"
        );


    const videoScreen =
        document.getElementById(
            "videoScreen"
        );


    /* ============================= */
    /* HIDE IDLE SCREEN               */
    /* ============================= */

    idle.style.display =
        "none";


    /* ============================= */
    /* SHOW VIDEO SCREEN              */
    /* ============================= */

    videoScreen.style.display =
        "block";


    /* ============================= */
    /* RESET VIDEO                   */
    /* ============================= */

    video.pause();

    video.currentTime = 0;


    /* ============================= */
    /* PLAY VIDEO                    */
    /* ============================= */

    video.play()

        .then(() => {


            console.log(
                "VIDEO PLAYING"
            );


        })

        .catch(error => {


            console.log(
                "VIDEO PLAY ERROR:",
                error
            );


        });


}


/* ================================= */
/* CHECK EVERY 1 SECOND              */
/* ================================= */

setInterval(

    checkTrigger,

    1000

);


/* ================================= */
/* INITIAL CHECK                     */
/* ================================= */

checkTrigger();


</script>


</body>

</html>
