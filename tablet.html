<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Digital India</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
}

#idle {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(
            circle,
            #173f67,
            #07111f 65%,
            #02060a
        );
}

#flag {
    font-size: 70px;
}

h1 {
    font-size: 55px;
    letter-spacing: 3px;
    margin: 10px 0;
}

h2 {
    font-size: 32px;
    margin: 10px 0;
}

p {
    font-size: 22px;
    margin-top: 30px;
    opacity: 0.85;
}

#video {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

</style>

</head>

<body>

<div id="idle">

    <div id="flag">🇮🇳</div>

    <h1>DIGITAL INDIA</h1>

    <h2>INDIA @ 2047</h2>

    <p>SCAN TODAY. SHAPE TOMORROW.</p>

    <div id="qrcode"></div>

</div>

<div id="video">

    <iframe
        src=""
        allow="autoplay; fullscreen">
    </iframe>

</div>

</body>
</html>
